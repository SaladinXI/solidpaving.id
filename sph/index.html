.container{max-width:760px;margin:0 auto;padding:2rem 1.25rem}
.card{background:#fff;border-radius:12px;border:0.5px solid #e0ddd6;padding:1.5rem;margin-bottom:1.25rem}

<!-- ===== ACCESS GATE (client-side, ganti hash untuk ubah password) ===== -->
<div id="__gate" style="position:fixed;inset:0;z-index:2147483647;background:#F4F7FB;display:flex;align-items:center;justify-content:center;font-family:Montserrat,system-ui,sans-serif;">
  <div style="background:#fff;border:1px solid rgba(46,62,95,.18);border-radius:12px;padding:30px 26px;max-width:330px;width:88%;box-shadow:0 8px 32px rgba(46,62,95,.12);text-align:center;">
    <div style="font-weight:800;color:#2E3E5F;font-size:18px;margin-bottom:6px;">Area Internal</div>
    <div style="color:#4A6080;font-size:13px;margin-bottom:16px;line-height:1.5;">Halaman ini khusus tim SolidPaving.id.</div>
    <input id="__gp" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;padding:11px 12px;border:1px solid rgba(46,62,95,.25);border-radius:8px;font-size:14px;box-sizing:border-box;margin-bottom:10px;">
    <button id="__gb" type="button" style="width:100%;padding:11px;background:#2E3E5F;color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Masuk</button>
    <div id="__ge" style="color:#C0392B;font-size:12px;margin-top:10px;min-height:14px;"></div>
  </div>
</div>
<script>
(function(){
  /* Untuk ganti password: buka Console browser di halaman ini, ketik:
       gateHash('passwordbaru')
     lalu salin hasilnya ke variabel HASH di bawah, di semua halaman tool. */
  var HASH="565ccec570fecadd1596ef6096805be4be2a804e839ae11f4d60844a80abcc3e";
  var KEY="sp_gate_ok";
  window.gateHash=async function(p){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');};
  function unlock(){var g=document.getElementById('__gate');if(g)g.parentNode.removeChild(g);}
  try{if(sessionStorage.getItem(KEY)==='1'){unlock();return;}}catch(e){}
  var inp=document.getElementById('__gp'),btn=document.getElementById('__gb'),err=document.getElementById('__ge');
  async function tryit(){var h=await window.gateHash(inp.value||'');if(h===HASH){try{sessionStorage.setItem(KEY,'1')}catch(e){}unlock();}else{err.textContent='Password salah';inp.value='';inp.focus();}}
  if(btn){btn.addEventListener('click',tryit);inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryit();});setTimeout(function(){inp.focus()},50);}
})();
</script>

function pavingDesc(it){ return'Paving Block '+it.jenis+' tebal '+it.tebal+' mutu '+it.mutu+' warna '+it.warna; }
function jasaScope(it){ return'Persiapan lahan, leveling (maks. kupas 5 cm), gelar abu batu 3–4 cm, jidar (screed) abu batu, pemasangan '+(it.refDesc||'paving block')+(it.tambahan?' dan '+it.tambahan:'')+', pengisian nat dengan abu batu, pemadatan paving dengan stamper, pembuatan kuncian dengan adukan sederhana'; }
function pemadatanScope(){ return'Gelar base course 5 cm, pemadatan menggunakan stamper kuda atau baby roller 2 ton'; }

var DESC_PRESETS=['Mobilisasi alat dan material','Pembongkaran paving/perkerasan lama','Galian tanah dan pembuangan','Urugan sirtu/pasir dan pemadatan','Pekerjaan pasangan kanstin/kerb','Pekerjaan saluran/drainase','Pengadaan dan pemasangan paving block','Finishing dan pembersihan lokasi'];
function computeDesc(it){
  if(it.type==='paving') return pavingDesc(it);
  if(it.type==='jasa-pasang') return 'Jasa Pasang. '+jasaScope(it);
  if(it.type==='pemadatan') return 'Jasa Pemadatan. '+pemadatanScope();
  if(it.type==='kanstin') return (it.jenis||'Kanstin')+(it.dimensi?' '+it.dimensi:'');
  return '';
}
function ensureDesc(it){ if(it.descText===undefined||it.descText===null){ it.descText=computeDesc(it); it.descDirty=false; } return it; }
function descField(it){
  var opts='<option value="">+ sisipkan preset deskripsi...</option>'+DESC_PRESETS.map(function(p){return'<option value="'+esc(p)+'">'+esc(p)+'</option>';}).join('');
  return '<div class="field"><label>Deskripsi <span data-id="'+it.id+'" data-action="descreset" style="color:#4A7FB5;cursor:pointer;font-weight:400;font-size:10px">(reset ke otomatis)</span></label>'+
    '<textarea data-id="'+it.id+'" data-key="descText" placeholder="Deskripsi item, bisa diketik/diedit bebas...">'+esc(it.descText||'')+'</textarea>'+
    '<select class="no-print" data-id="'+it.id+'" data-key="descpreset" style="margin-top:5px;font-size:12px">'+opts+'</select>'+
  '</div>';
}

function getSubtotal(){
  return items.reduce(function(s,it){
    if(it.type==='kanstin') return s+(parseFloat(it.harga_pcs)||0)+(parseFloat(it.vol)||0)*(parseFloat(it.harga_pasang)||0);
    return s+(parseFloat(it.vol)||0)*(parseFloat(it.harga)||0);
  },0);
}
function getGrandTotal(){
  var sub=getSubtotal(), ppn=parseInt(document.getElementById('ppn').value)||0;
  return sub*(1+ppn/100);
}

function renderItems(){
  var html='';
  items.forEach(function(it){
    ensureDesc(it);
    if(it.type==='paving') html+=bPaving(it);
    else if(it.type==='jasa-pasang') html+=bJasa(it);
    else if(it.type==='pemadatan') html+=bPemadatan(it);
    else if(it.type==='kanstin') html+=bKanstin(it);
    else html+=bCustom(it);
  });
  document.getElementById('item-blocks').innerHTML=html;
  renderSummary();
  updateTerminValues();
}

// ── Termins ──
function addTermin(){
  var idx=termins.length;
  var defaults=[
    {nama:'Termin I — Uang Muka (DP)',pct:30,trigger:TRIGGER[0]},
    {nama:'Termin II — Progress',pct:40,trigger:TRIGGER[3]},
    {nama:'Termin III — Pelunasan',pct:25,trigger:TRIGGER[6]},
    {nama:'Termin IV — Retensi',pct:5,trigger:TRIGGER[7]}
  ];
  var d=defaults[idx]||{nama:'Termin '+(idx+1),pct:0,trigger:TRIGGER[0]};
  termins.push({id:newTid(),nama:d.nama,pct:d.pct,trigger:d.trigger});
  renderTermins();
}
function removeTermin(id){
  if(termins.length<=1) return;
  termins=termins.filter(function(t){return t.id!==id;});
  renderTermins();
}
function renderTermins(){
  var gt=getGrandTotal();
  var tOpts=function(cur){ return TRIGGER.map(function(o){return'<option'+(o===cur?' selected':'')+' value="'+esc(o)+'">'+esc(o)+'</option>';}).join(''); };
  document.getElementById('termins').innerHTML=termins.map(function(t){
    var trigC=(t.customTrig||(t.trigger&&TRIGGER.indexOf(t.trigger)<0));
    var trigSel='<select class="inp" data-tid="'+t.id+'" data-tkey="trigSel">'+TRIGGER.map(function(o){return'<option value="'+esc(o)+'"'+((!trigC&&o===t.trigger)?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'<option value="__custom"'+(trigC?' selected':'')+'>+ Ketik sendiri...</option></select>';
    var trigCust=trigC?'<input class="inp" type="text" data-tid="'+t.id+'" data-tkey="trigger" value="'+esc(t.trigger)+'" placeholder="Tulis pemicu sendiri..." style="margin-top:4px">':'';
    return'<div class="termin-row">'+
      '<input class="inp" type="text" data-tid="'+t.id+'" data-tkey="nama" value="'+esc(t.nama)+'">'+
      '<input class="inp" type="number" data-tid="'+t.id+'" data-tkey="pct" value="'+t.pct+'" min="0" max="100">'+
      '<span class="termin-rp" id="trp-'+t.id+'">'+(gt>0?'Rp '+fmt(gt*t.pct/100):'—')+'</span>'+
      '<div style="display:flex;flex-direction:column;min-width:0">'+trigSel+trigCust+'</div>'+
      '<button class="btn-del-t" data-taction="del" data-tid="'+t.id+'">&#215;</button>'+
    '</div>';
  }).join('');
  updateTerminWarn();
}
function updateTerminValues(){
  var gt=getGrandTotal();
  termins.forEach(function(t){
    var el=document.getElementById('trp-'+t.id);
    if(el) el.textContent=gt>0?'Rp '+fmt(gt*t.pct/100):'—';
  });
  updateTerminWarn();
}
function updateTerminWarn(){
  var sum=Math.round(termins.reduce(function(s,t){return s+t.pct;},0)*10)/10;
  var w=document.getElementById('termin-warn');
  if(!w) return;
  if(sum!==100){w.textContent='⚠ Total termin '+sum+'% — harus 100%';w.style.color='#e24b4a';}
  else{w.textContent='✓ Total termin 100%';w.style.color='#3B6D11';}
}

// ── Event listeners ──
document.getElementById('item-blocks').addEventListener('change',function(e){
  var el=e.target,id=parseInt(el.dataset.id),key=el.dataset.key;
  if(!id||!key) return;
  var it=items.find(function(x){return x.id===id;});
  if(it){
    it[key]=el.value;
    if(key==='descText'){ it.descDirty=(el.value.trim()!==''); }
    else if(key==='descpreset'){ if(el.value){ it.descText=el.value; it.descDirty=true; } }
    else if(['jenis','tebal','mutu','warna','refDesc','tambahan','dimensi'].indexOf(key)>=0 && !it.descDirty){ it.descText=computeDesc(it); }
    renderItems();
  }
});
document.getElementById('item-blocks').addEventListener('input',function(e){
  var el=e.target,id=parseInt(el.dataset.id),key=el.dataset.key;
  if(!id||!key||el.readOnly) return;
  var it=items.find(function(x){return x.id===id;});
  if(it){it[key]=el.value; if(key==='descText'){ it.descDirty=(el.value.trim()!==''); } renderSummary();updateTerminValues();}
});
document.getElementById('item-blocks').addEventListener('click',function(e){
  if(e.target.dataset.action==='del'){
    items=items.filter(function(x){return x.id!==parseInt(e.target.dataset.id);});
    renderItems();
  } else if(e.target.dataset.action==='descreset'){
    var it=items.find(function(x){return x.id===parseInt(e.target.dataset.id);});
    if(it){ it.descText=computeDesc(it); it.descDirty=false; renderItems(); }
  }
});

document.getElementById('termins').addEventListener('input',function(e){
  var el=e.target,id=parseInt(el.dataset.tid),key=el.dataset.tkey;
  if(!id||!key) return;
  var t=termins.find(function(x){return x.id===id;});
  if(t){t[key]=key==='pct'?parseFloat(el.value)||0:el.value;updateTerminValues();}
});
document.getElementById('termins').addEventListener('change',function(e){
  var el=e.target,id=parseInt(el.dataset.tid),key=el.dataset.tkey;
  if(!id||!key) return;
  var t=termins.find(function(x){return x.id===id;});
  if(!t) return;
  if(key==='trigSel'){
    if(el.value==='__custom'){ t.customTrig=true; }
    else { t.trigger=el.value; t.customTrig=false; }
    renderTermins();
  } else { t[key]=el.value; }
});
document.getElementById('termins').addEventListener('click',function(e){
  if(e.target.dataset.taction==='del') removeTermin(parseInt(e.target.dataset.tid));
});

document.getElementById('ppn').addEventListener('change',function(){renderSummary();updateTerminValues();});
document.getElementById('btn-paving').addEventListener('click',addPaving);
document.getElementById('btn-jasa').addEventListener('click',addJasaPasang);
document.getElementById('btn-pemadatan').addEventListener('click',addPemadatan);
document.getElementById('btn-kanstin').addEventListener('click',addKanstin);
document.getElementById('btn-custom').addEventListener('click',addCustom);
document.getElementById('btn-add-termin').addEventListener('click',addTermin);
document.getElementById('btn-preview').addEventListener('click',generatePreview);
document.getElementById('btn-back').addEventListener('click',function(){
